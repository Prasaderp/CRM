# alembic.ini — Alembic configuration for real-estate-crm migrations.
# Database URL is resolved from Settings at runtime; never embed credentials here.

[alembic]
# Resolve from this file so documented root-level invocations are deterministic.
script_location = %(here)s/migrations

# Template to use when generating new revision files.
file_template = %%(rev)s_%%(slug)s

# Timezone for --autogenerate revision timestamps.
timezone = UTC

# Truncate long revision slugs at this character count.
truncate_slug_length = 40

# Do NOT set sqlalchemy.url here — env.py reads it from config.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
