[project]
name = "real-estate-crm"
version = "0.1.0"
description = "Real-Estate Lead Capture CRM"
requires-python = "==3.12.10"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "email-validator==2.3.0",
    "argon2-cffi==25.1.0",
    "structlog==26.1.0",
    "prometheus-client==0.25.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.15.22",
    "mypy==2.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/real_estate_crm"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
